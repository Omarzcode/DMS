<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>EMS Preacher Portal</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0d0f08;
      color: #e8dfc8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(232, 223, 200, 0.2);
      border-top-color: #e8dfc8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <div style="font-size: 16px; font-weight: 600;">EMS Preacher Portal</div>
  <p style="font-size: 13px; opacity: 0.7; margin-top: 6px;">Loading application...</p>
  <script>
    // Seamlessly navigate to the dynamic application route
    window.location.replace('/');
  </script>
</body>
</html>
